<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo gallery</title>
<style>
  :root { --app-accent:#1d4ed8; --app-ink:#0f172a; --app-muted:#64748b; --app-line:#e2e8f0; --app-bg:#ffffff; --app-soft:#f8fafc; }
  * { box-sizing:border-box; }
  body { font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--app-ink); margin:0; padding:20px; background:var(--app-bg); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; }
  .grid img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:10px; border:1px solid var(--app-line); cursor:pointer; display:block; }
  .lb { display:none; position:fixed; inset:0; background:rgba(5,8,15,.88); z-index:99; }
  .lb img { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); max-width:88vw; max-height:82vh; border-radius:10px; }
  .lb .cap { position:absolute; bottom:26px; left:0; right:0; text-align:center; color:#fff; font-size:14px; }
  .lb .x { position:absolute; top:16px; right:20px; color:#fff; font-size:30px; cursor:pointer; }
  .lb .nav { position:absolute; top:50%; transform:translateY(-50%); color:#fff; font-size:34px; cursor:pointer; padding:20px; user-select:none; }
  .lb .prev { left:6px; } .lb .next { right:6px; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<div class="lb" id="lb">
  <span class="x" id="x">\u00d7</span>
  <span class="nav prev" id="p">\u2039</span>
  <img id="big" alt="">
  <span class="nav next" id="n">\u203a</span>
  <div class="cap" id="cap"></div>
</div>
<script type="application/json" id="app-config">
{
  "photos": [
    { "src": "", "caption": "" }
  ]
}
</script>
<script>
(function () {
  var cfg = {};
  try { cfg = JSON.parse(document.getElementById("app-config").textContent); } catch (e) {}
  var photos = (cfg.photos || []).filter(function (p) { return p.src; });
  var grid = document.getElementById("grid"), lb = document.getElementById("lb"), big = document.getElementById("big"), cap = document.getElementById("cap");
  var i = 0;
  photos.forEach(function (p, k) {
    var im = document.createElement("img");
    im.src = p.src; im.alt = p.caption || "Photo"; im.loading = "lazy";
    im.addEventListener("click", function () { open(k); });
    grid.appendChild(im);
  });
  function open(k) { i = k; big.src = photos[i].src; cap.textContent = photos[i].caption || ""; lb.style.display = "block"; }
  function close() { lb.style.display = "none"; }
  function move(d) { i = (i + d + photos.length) % photos.length; big.src = photos[i].src; cap.textContent = photos[i].caption || ""; }
  document.getElementById("x").addEventListener("click", close);
  document.getElementById("p").addEventListener("click", function () { move(-1); });
  document.getElementById("n").addEventListener("click", function () { move(1); });
  lb.addEventListener("click", function (e) { if (e.target === lb) close(); });
  document.addEventListener("keydown", function (e) {
    if (lb.style.display !== "block") return;
    if (e.key === "Escape") close();
    if (e.key === "ArrowLeft") move(-1);
    if (e.key === "ArrowRight") move(1);
  });
})();
</script>
</body>
</html>

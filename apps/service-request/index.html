<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request service</title>
<style>
  :root { --app-accent:#1d4ed8; --app-ink:#0f172a; --app-muted:#64748b; --app-line:#e2e8f0; --app-bg:#ffffff; --app-soft:#f8fafc; }
  * { box-sizing:border-box; }
  body { font:16px/1.5 system-ui,sans-serif; color:var(--app-ink); margin:0; padding:20px; background:var(--app-bg); }
  h2 { margin:0 0 4px; font-size:20px; }
  .hint { margin:0 0 14px; color:var(--app-muted); font-size:13px; }
  label { display:block; font-weight:600; margin:12px 0 4px; font-size:14px; }
  input, textarea { width:100%; padding:10px; border:1px solid var(--app-line); border-radius:8px; font:inherit; }
  .row { display:flex; align-items:center; gap:8px; margin-top:12px; font-size:14px; }
  .row input { width:auto; }
  .row label { margin:0; }
  button { margin-top:16px; width:100%; background:var(--app-accent); color:#fff; border:0; border-radius:8px; padding:13px; font-weight:700; font-size:15px; cursor:pointer; }
  .done { display:none; background:var(--app-soft); border:1px solid var(--app-line); border-radius:10px; padding:16px; margin-top:14px; }
  .done b { display:block; margin-bottom:6px; }
  .sum { color:var(--app-muted); font-size:13px; white-space:pre-wrap; }
</style>
</head>
<body>
<div id="formwrap">
<h2>Request service</h2>
<p class="hint">Tell us what's going on. We reply the same business day.</p>
<form id="f">
  <label>Your name<input name="name" required></label>
  <label>Phone<input name="phone" type="tel" required></label>
  <label>Address<input name="address"></label>
  <label>What's going on?<textarea name="issue" rows="4" required></textarea></label>
  <div class="row"><input type="checkbox" id="urgent"> <label for="urgent">This is urgent</label></div>
  <button type="submit">Send request</button>
</form>
</div>
<div class="done" id="done">
  <b id="donetitle">Request received.</b>
  <div class="sum" id="sum"></div>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var endpoint = q.get("endpoint") || "";
  var email = q.get("email") || "";
  document.getElementById("f").addEventListener("submit", function (e) {
    e.preventDefault();
    var d = {};
    new FormData(e.target).forEach(function (v, k) { d[k] = v; });
    d.urgent = document.getElementById("urgent").checked;
    var summary = d.name + " \u00b7 " + d.phone + (d.address ? " \u00b7 " + d.address : "") + (d.urgent ? " \u00b7 URGENT" : "") + "\n" + d.issue;
    function show(title, text) {
      document.getElementById("formwrap").style.display = "none";
      document.getElementById("donetitle").textContent = title;
      document.getElementById("sum").textContent = text;
      document.getElementById("done").style.display = "block";
    }
    if (endpoint) {
      fetch(endpoint, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(d) })
        .then(function (r) { if (!r.ok) throw new Error("bad status"); })
        .then(function () { show("Request received.", "We reply the same business day."); })
        .catch(function () { fallback(); });
    } else { fallback(); }
    function fallback() {
      if (email) {
        location.href = "mailto:" + email + "?subject=" + encodeURIComponent("Service request") + "&body=" + encodeURIComponent(summary);
      }
      show("Almost there.", "Copy this and text or call it in:\n\n" + summary);
    }
  });
})();
</script>
</body>
</html>
